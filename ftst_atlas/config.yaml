name: "FTST ATLAS"
version: "0.9.0"
slug: "ftst_atlas"
description: "Firmenassistent mit lokalem Wissen, optionaler Online-Beratung und Hintergrundaufträgen."
url: "https://github.com/hgoekcay/ftst-angebotsdesigner"
arch:
  - amd64
startup: application
boot: manual
init: false
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: ATLAS
panel_admin: true
ports:
  8100/tcp: null
  8101/tcp: null
ports_description:
  8101/tcp: "Nur Google OAuth-Rückleitung; separater HTTPS-Reverse-Proxy erforderlich"
  8100/tcp: "Nur Belegupload; HTTPS-Reverse-Proxy erforderlich"
timeout: 30
options:
  calendar_provider: home_assistant
  calendar_enabled: false
  ollama_url: "http://76b650ab-ftst-local-ai:11434"
  model: "qwen3:4b-instruct-2507-q4_K_M"
  voice_enabled: false
  voice_whisper_host: "core-whisper"
  voice_piper_host: "core-piper"
  telegram_enabled: false
  mail_enabled: false
  mail_bridge_url: "http://76b650ab-ftst-strato-mail:8098"
  mail_account_id: "primary"
  mail_account_ids: []
  bookkeeping_enabled: false
  bookkeeping_auto_sync: false
  bookkeeping_interval_seconds: 3600
  bookkeeping_lookback_days: 30
  bookkeeping_telegram_daily: false
  bookkeeping_telegram_time: "09:00"
  submissions_enabled: false
  billomat_enabled: false
  live_enabled: false
  live_daily_limit: 10
  live_max_seconds: 600
  online_enabled: false
  online_model: "gpt-6-astra"
  online_daily_limit: 10
  online_share_profile: false
schema:
  calendar_provider: list(home_assistant|google)
  google_client_id: "str?"
  google_client_secret: "password?"
  google_redirect_uri: "url?"
  calendar_enabled: bool
  calendar_entity_id: "str?"
  calendar_ha_user_id: "str?"
  ollama_url: url
  model: str
  voice_enabled: bool
  voice_ha_user_id: "str?"
  voice_whisper_host: str
  voice_piper_host: str
  telegram_enabled: bool
  telegram_token: "password?"
  telegram_user_id: "str?"
  telegram_ha_user_id: "str?"
  mail_enabled: bool
  mail_bridge_url: url
  mail_bridge_token: "password?"
  mail_ha_user_id: "str?"
  mail_account_id: str
  mail_account_ids:
    - str
  bookkeeping_enabled: bool
  bookkeeping_ha_user_id: "str?"
  bookkeeping_auto_sync: bool
  bookkeeping_interval_seconds: "int(900,86400)"
  bookkeeping_lookback_days: "int(1,365)"
  bookkeeping_telegram_daily: bool
  bookkeeping_telegram_time: str
  submissions_enabled: bool
  submissions_public_url: "url?"
  billomat_enabled: bool
  billomat_ha_user_id: "str?"
  billomat_subdomain: "str?"
  billomat_api_key: "password?"
  live_enabled: bool
  live_daily_limit: "int(1,100)"
  live_max_seconds: "int(60,600)"
  online_enabled: bool
  openai_api_key: "password?"
  online_ha_user_id: "str?"
  online_model: str
  online_daily_limit: "int(1,100)"
  online_share_profile: bool
