configuration:
  ollama_vision_model:
    name: Lokales Bildmodell
    description: gemma3:4b für Bildvorschläge. Zuvor in FTST Lokale KI die Bildmodell-Vorbereitung aktivieren. Keine Cloud-Verarbeitung.
  strato_provider:
    name: STRATO-Verbindungsart
    description: bridge verwendet die lokale STRATO Mail-App. direct benötigt ein eigenes Postfachpasswort. Kein automatischer Wechsel.
  strato_bridge_token:
    name: Schlüssel zur lokalen Mail-App
    description: Gemeinsamer zufälliger Verbindungsschlüssel; kein Postfachpasswort. Nur für bridge.
  strato_auto_import:
    name: Neue Mails automatisch importieren
    description: Erst nach bewusst gesetztem Startpunkt. Bestehende Nachrichten werden nicht rückwirkend importiert.
  strato_auto_ai:
    name: Lokale KI-Entwürfe automatisch vorbereiten
    description: Entwürfe sind ungeprüft. Kein Versand und keine verbindlichen Zusagen.
  strato_poll_seconds:
    name: Abrufabstand in Sekunden
    description: 60 bis 3600 Sekunden; Standard 300.
  strato_imap_enabled:
    name: STRATO-Lesepilot aktivieren
    description: Nur info@ftst.eu. Abruf erst nach bewusst gesetztem Startpunkt. Automatischer Import ist separat aktivierbar.
  strato_imap_password:
    name: STRATO-Postfachpasswort
    description: Passwort für info@ftst.eu. Nur hier eingeben; HA-Administratoren und Sicherungen schützen.
