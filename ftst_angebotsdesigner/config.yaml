name: "FTST AngebotsDesigner"
version: "0.13.1"
slug: "ftst_angebotsdesigner"
description: "Professioneller AngebotsDesigner für FT Sicherheitstechnik mit Billomat-Anbindung und PDF-Erstellung."
arch:
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:file-document-edit-outline
panel_title: "FTST Angebote"
panel_admin: true
webui: "http://[HOST]:[PORT:8099]/"
options:
  strato_auto_import: false
  strato_auto_ai: false
  strato_poll_seconds: 300
  strato_provider: direct
  strato_bridge_token: ""
  strato_imap_enabled: false
  strato_imap_password: ""
  ai_provider: ollama
  ollama_vision_model: "gemma3:4b"
  billomat_id: ""
  billomat_api_key: ""
  flask_secret: ""
  openai_api_key: ""
  openai_model: "gpt-4.1"
  openai_transcribe_model: "gpt-4o-mini-transcribe"
schema:
  strato_auto_import: bool
  strato_auto_ai: bool
  strato_poll_seconds: int(60,3600)
  strato_provider: list(direct|bridge)
  strato_bridge_token: password?
  strato_imap_enabled: bool
  strato_imap_password: password?
  ai_provider: list(ollama|openai)
  ollama_vision_model: str?
  billomat_id: str?
  billomat_api_key: password?
  flask_secret: password?
  openai_api_key: password?
  openai_model: str?
  openai_transcribe_model: str?
