  billomat_id: ""
  billomat_api_key: ""
  flask_secret: ""
  openai_api_key: ""
  openai_model: "gpt-4.1"
  openai_transcribe_model: "gpt-4o-mini-transcribe"
schema:
  ai_provider: list(ollama|openai)
  billomat_id: str?
  billomat_api_key: password?
  flask_secret: password?
  openai_api_key: password?
  openai_model: str?
  openai_transcribe_model: str?
