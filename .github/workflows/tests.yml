name: Tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mail-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ftst_strato_mail/app/requirements.lock pytest
      - run: PYTHONPATH=ftst_strato_mail/app python -m pytest -q tests_bridge
      - run: docker build -t ftst-strato-mail:test ftst_strato_mail
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q ftst_angebotsdesigner
      - run: python -m ruff check --select E9,F63,F7,F82 ftst_angebotsdesigner tests
      - run: python -m pytest -q
  barcode-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/barcode_browser.cjs tests/pdf_browser.cjs tests/material_upload_browser.cjs tests/offer_delivery_browser.cjs tests/atlas_upload_browser.cjs tests/atlas_knowledge_ui.cjs tests/atlas_workflows_ui.cjs tests/atlas_dialog_ui.cjs
  local-ai-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned local service
        run: docker build --build-arg BUILD_VERSION=0.1.1 --build-arg BUILD_ARCH=amd64 -t ftst-local-ai:test ftst_local_ai
      - name: Check startup and shutdown without downloading a model
        run: |
          mkdir -p "$RUNNER_TEMP/ftst-local-ai"
          printf '%s\n' '{"prepare_model":false,"download_attempt":1}' > "$RUNNER_TEMP/ftst-local-ai/options.json"
          docker run -d --name ftst-local-ai-test --memory=4g --cpus=2 -p 127.0.0.1:11434:11434 -v "$RUNNER_TEMP/ftst-local-ai:/data" ftst-local-ai:test
          trap 'docker logs ftst-local-ai-test; docker rm -f ftst-local-ai-test' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/ftst-models.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/ftst-models.json"))["models"] == []'
          docker stop -t 25 ftst-local-ai-test
          test "$(docker inspect -f '{{.State.ExitCode}}' ftst-local-ai-test)" = 0

  atlas-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ATLAS with PDF parser
        run: docker build --build-arg BUILD_VERSION=0.8.0 --build-arg BUILD_ARCH=amd64 -t ftst-atlas:test ftst_atlas
      - name: Smoke test module wiring without integrations
        run: docker run --rm --entrypoint python3 ftst-atlas:test -c 'import tempfile; from app import App; a=App(tempfile.mkdtemp(),dev=True); assert not a.bookkeeping_sync.enabled_for("dev"); assert a.bookkeeping.list("dev")==[]; assert not a.voice.status("dev")["enabled"]; assert len(a.workflows.catalog("dev")["workflows"])==2; import pypdf, submissions_server, bookkeeping_export, bookkeeping_reports; a.jobs.stop()'
